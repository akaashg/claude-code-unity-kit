name: Rule proposal
description: Propose a rule or check
labels: [rule]
body:
  - type: textarea
    id: rule
    attributes:
      label: The rule
      description: One sentence. What Claude should or shouldn't do in a Unity project.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Where it comes from
      description: The real problem you hit, a Unity issue tracker link, or a Unity doc page. Rules without a source won't be added.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Stage or platform rule
      options: ["Pipeline stage (any Unity 6 project)", "Platform rule (a Unity version, package or build target)"]
    validations:
      required: true
