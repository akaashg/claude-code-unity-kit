name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json plugins/*/hooks/hooks.json; do
            jq empty "$f" && echo "ok   $f"
          done
      - name: Check skill and agent frontmatter
        run: sh tests/frontmatter.test.sh
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md"

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.286
      - name: Validate plugin and marketplace
        run: |
          claude plugin validate --strict plugins/unity-kit
          claude plugin validate --strict .

  hook-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Run hook script tests
        run: sh tests/hooks.test.sh
